services:
  vlesspanel:
    build: .
    container_name: vlesspanel
    ports:
      - "9090:8080"
    volumes:
      - ./data:/data
      - /opt/aggregator-configs:/opt/aggregator-configs
    environment:
      - VLESSPANEL_PORT=8080
      - VLESSPANEL_AGGREGATOR_DIR=/opt/aggregator-configs/configs
      - VLESSPANEL_PANELS_FILE=/data/panels.json
      - VLESSPANEL_STATIC_DIR=/app/static
      - VLESSPANEL_VLESSSUBTEST_DAEMON_URL=http://vlesssubtest:7070
      # TG-алерты (Этап 2): токен/чат — из .env (в .gitignore, НЕ коммитить),
      # пороги — с дефолтами (переопределяются через .env без правки compose).
      - VLESSPANEL_ALERTS_ENABLED=${VLESSPANEL_ALERTS_ENABLED:-true}
      - VLESSPANEL_TG_BOT_TOKEN=${VLESSPANEL_TG_BOT_TOKEN:-}
      - VLESSPANEL_TG_CHAT_ID=${VLESSPANEL_TG_CHAT_ID:-}
      - VLESSPANEL_ALERT_RAM_PCT=${VLESSPANEL_ALERT_RAM_PCT:-85}
      - VLESSPANEL_ALERT_LOAD_CORES=${VLESSPANEL_ALERT_LOAD_CORES:-1}
      - VLESSPANEL_ALERT_LOAD_FACTOR=${VLESSPANEL_ALERT_LOAD_FACTOR:-1.0}
      - VLESSPANEL_ALERT_TRAFFIC_MULT=${VLESSPANEL_ALERT_TRAFFIC_MULT:-3}
      - VLESSPANEL_ALERT_TRAFFIC_WINDOW=${VLESSPANEL_ALERT_TRAFFIC_WINDOW:-24h}
      - VLESSPANEL_ALERT_TRAFFIC_MIN_SAMPLES=${VLESSPANEL_ALERT_TRAFFIC_MIN_SAMPLES:-6}
      - VLESSPANEL_ALERT_TESTER_STALE=${VLESSPANEL_ALERT_TESTER_STALE:-15m}
      - VLESSPANEL_ALERT_COOLDOWN=${VLESSPANEL_ALERT_COOLDOWN:-6h}
      - VLESSPANEL_ALERT_SEND_TIMEOUT=${VLESSPANEL_ALERT_SEND_TIMEOUT:-10s}
    networks:
      - vlesspanel-net
    restart: unless-stopped

  vlesssubtest:
    image: vlesssubtest:latest
    container_name: vlesssubtest
    # --log накапливает прогоны в bbolt; /data/results.db лежит вне контейнера.
    # /data/config.json — опциональный конфиг крона (см. README vlesssubtest).
    command: --port=7070 --log --db=/data/results.db --cron-config=/data/config.json
    ports:
      - "7070:7070"
    volumes:
      - ./data/vlesssubtest:/data
    networks:
      - vlesspanel-net
    restart: unless-stopped

networks:
  vlesspanel-net:
    name: vlesspanel-net
