services:
  vlesspanel:
    build: .
    container_name: vlesspanel
    ports:
      - "9090:8080"
    volumes:
      - ./data:/data
      - /opt/aggregator-configs/configs:/opt/aggregator-configs/configs
    environment:
      - VLESSPANEL_PORT=8080
      - VLESSPANEL_AGGREGATOR_DIR=/opt/aggregator-configs/configs
      - VLESSPANEL_PANELS_FILE=/data/panels.json
      - VLESSPANEL_STATIC_DIR=/app/static
      - VLESSPANEL_VLESSSUBTEST_DAEMON_URL=http://vlesssubtest:7070
    networks:
      - vlesspanel-net
    restart: unless-stopped

  vlesssubtest:
    image: vlesssubtest:latest
    container_name: vlesssubtest
    # --log накапливает прогоны в bbolt; /data/results.db лежит вне контейнера.
    # /data/config.json — опциональный конфиг крона (см. README vlesssubtest).
    command: --port=7070 --log --db=/data/results.db --cron-config=/data/config.json
    ports:
      - "7070:7070"
    volumes:
      - ./data/vlesssubtest:/data
    networks:
      - vlesspanel-net
    restart: unless-stopped

networks:
  vlesspanel-net:
    name: vlesspanel-net
